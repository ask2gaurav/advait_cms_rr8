# Local MongoDB for the CMS admin — used only on the developer's machine.
# The public site is 100% static and has no database, so this is never deployed.
#
#   npm run db:up      # start (detached)
#   npm run db:down    # stop
#   npm run db:shell   # mongosh into the `cms` database
#   npm run db:reset   # stop AND delete all data (destructive)

services:
  mongo:
    image: mongo:7
    container_name: cms-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - cms-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  cms-mongo-data:
